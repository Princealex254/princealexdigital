<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Prince Alex Digital</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --primary-color: #4CAF50;
            --secondary-color: #8BC34A;
            --text-color: #2c3e50;
            --light-bg: #f8fafc;
            --white: #ffffff;
            --shadow: 0 10px 25px rgba(0,0,0,0.08);
            --border-color: #e2e8f0;
            --border-radius: 16px;
            --error-color: #f44336;
            --success-color: #4CAF50;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background: linear-gradient(135deg, var(--light-bg) 0%, #e8f5e8 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .reset-container {
            max-width: 450px;
            width: 100%;
            background-color: var(--white);
            padding: 40px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            color: var(--primary-color);
            margin-bottom: 10px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 15px;
            color: var(--text-color);
        }

        p {
            margin-bottom: 25px;
            color: #666;
        }

        .reset-form input {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-family: inherit;
            font-size: 16px;
        }

        .reset-form input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(76,175,80,0.3);
        }

        .reset-form button {
            width: 100%;
            padding: 15px;
            background-color: var(--primary-color);
            color: var(--white);
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 600;
            transition: background-color 0.3s;
        }

        .reset-form button:hover {
            background-color: var(--secondary-color);
        }

        .reset-form button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-weight: 500;
            display: none; /* Hidden by default */
        }

        .message.error {
            background-color: #ffebee;
            color: var(--error-color);
            border: 1px solid var(--error-color);
            display: block;
        }

        .message.success {
            background-color: #e8f5e9;
            color: var(--success-color);
            border: 1px solid var(--success-color);
            display: block;
        }

        .back-link {
            margin-top: 25px;
            display: inline-block;
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="reset-container">
        <div class="logo">Prince Alex Digital</div>
        <h1>Reset Your Password</h1>
        <p id="instruction-text">Please enter your new password below.</p>

        <form id="reset-form" class="reset-form">
            <input type="password" id="new-password" placeholder="New Password" required>
            <input type="password" id="confirm-password" placeholder="Confirm New Password" required>
            <button type="submit" id="submit-btn">Reset Password</button>
        </form>

        <div id="message-area" class="message"></div>

        <a href="/index.html" class="back-link" id="back-link" style="display: none;">Back to Store</a>
    </div>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
        import { getAuth, confirmPasswordReset, verifyPasswordResetCode } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';

        // Your web app's Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDGErPBeQ1Fdx9EHPXOHepoEoOx7P2f57o",
            authDomain: "princealextravel.firebaseapp.com",
            projectId: "princealextravel",
            storageBucket: "princealextravel.firebasestorage.app",
            messagingSenderId: "947577729462",
            appId: "1:947577729462:web:dd4b4c7cb4a984c5e3d117"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const form = document.getElementById('reset-form');
        const newPasswordInput = document.getElementById('new-password');
        const confirmPasswordInput = document.getElementById('confirm-password');
        const messageArea = document.getElementById('message-area');
        const submitBtn = document.getElementById('submit-btn');
        const instructionText = document.getElementById('instruction-text');
        const backLink = document.getElementById('back-link');

        // Get the action code from the URL
        const urlParams = new URLSearchParams(window.location.search);
        const actionCode = urlParams.get('oobCode');

        // Immediately verify the code
        if (actionCode) {
            verifyPasswordResetCode(auth, actionCode).then((email) => {
                instructionText.textContent = `Create a new password for ${email}.`;
            }).catch((error) => {
                messageArea.className = 'message error';
                messageArea.textContent = 'The password reset link is invalid or has expired. Please request a new one.';
                form.style.display = 'none';
                backLink.style.display = 'inline-block';
            });
        } else {
            messageArea.className = 'message error';
            messageArea.textContent = 'No password reset code found. Please make sure you are using the link from your email.';
            form.style.display = 'none';
            backLink.style.display = 'inline-block';
        }

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const newPassword = newPasswordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (newPassword.length < 6) {
                messageArea.className = 'message error';
                messageArea.textContent = 'Password must be at least 6 characters long.';
                return;
            }

            if (newPassword !== confirmPassword) {
                messageArea.className = 'message error';
                messageArea.textContent = 'Passwords do not match.';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Resetting...';

            // Save the new password
            confirmPasswordReset(auth, actionCode, newPassword).then(() => {
                messageArea.className = 'message success';
                messageArea.textContent = 'Your password has been reset successfully! You can now log in with your new password.';
                form.style.display = 'none';
                instructionText.style.display = 'none';
                backLink.style.display = 'inline-block';
            }).catch((error) => {
                messageArea.className = 'message error';
                messageArea.textContent = 'Error resetting password. The link may have expired. Please try again.';
                console.error('Password Reset Error:', error);
                submitBtn.disabled = false;
                submitBtn.textContent = 'Reset Password';
            });
        });
    </script>
</body>
</html>
