<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --maroon:#6b0f1a;
      --maroon-dark:#4a0a12;
      --gold:#d4af37;
      --gold-soft:#f5e6a8;

      --bg:#f7f5f3;
      --card:#ffffff;
      --text:#2b2b2b;
      --muted:#6b7280;

      --danger:#b91c1c;
      --success:#15803d;

      --border:#e5e7eb;
      --shadow:0 20px 45px rgba(0,0,0,.12);
      --radius:18px;
    }

    *{box-sizing:border-box;margin:0;padding:0}

    body{
      font-family:'Poppins',system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:22px;
      background:
        radial-gradient(900px 450px at 10% 0%, rgba(212,175,55,.10), transparent 60%),
        radial-gradient(700px 400px at 90% 20%, rgba(107,15,26,.08), transparent 55%),
        linear-gradient(180deg, #faf7f5, #f1ede9);
      color:var(--text);
    }

    .wrap{width:100%;max-width:520px}

    .topbar{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:14px;
      gap:12px;
    }

    .badge{
      padding:8px 14px;
      border-radius:999px;
      font-size:12px;
      font-weight:700;
      background:rgba(107,15,26,.08);
      color:var(--maroon);
      border:1px solid rgba(107,15,26,.18);
    }

    .powered{
      font-size:12px;
      color:var(--muted);
      text-align:right;
    }
    .powered strong{color:var(--maroon)}

    .card{
      background:var(--card);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      overflow:hidden;
      border:1px solid var(--border);
    }

    .accent{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      height:6px;
    }
    .accent span:nth-child(1){background:var(--maroon)}
    .accent span:nth-child(2){background:var(--gold)}
    .accent span:nth-child(3){background:var(--maroon-dark)}

    .header{
      padding:24px 24px 14px;
      border-bottom:1px solid var(--border);
      background:
        linear-gradient(180deg, #fff, #faf7f5);
    }

    h1{
      font-size:22px;
      font-weight:800;
      color:var(--maroon-dark);
    }

    #instruction-text{
      margin-top:6px;
      font-size:13px;
      color:var(--muted);
      line-height:1.5;
    }

    .content{padding:20px 24px 24px}

    form{display:grid;gap:14px;margin-top:14px}

    label{
      font-size:12px;
      font-weight:600;
      color:#444;
    }

    input{
      width:100%;
      padding:14px;
      border-radius:14px;
      border:1px solid var(--border);
      font-size:14px;
      outline:none;
      background:#fff;
    }
    input:focus{
      border-color:var(--maroon);
      box-shadow:0 0 0 3px rgba(107,15,26,.15);
    }

    .hint{
      font-size:12px;
      color:var(--muted);
    }

    button{
      margin-top:6px;
      width:100%;
      padding:14px 16px;
      border:none;
      cursor:pointer;
      border-radius:14px;
      font-weight:800;
      font-size:14px;
      color:#fff;
      background:
        linear-gradient(135deg, var(--maroon), var(--maroon-dark));
      box-shadow:0 14px 30px rgba(107,15,26,.35);
      transition:transform .08s ease, filter .2s ease, opacity .2s ease;
    }
    button:hover{filter:brightness(1.05)}
    button:active{transform:translateY(1px)}
    button:disabled{opacity:.6;cursor:not-allowed;box-shadow:none}

    .message{
      margin-top:16px;
      padding:14px;
      border-radius:14px;
      font-size:13px;
      display:none;
      border:1px solid transparent;
    }
    .message.show{display:block}
    .message.error{
      background:#fef2f2;
      border-color:#fecaca;
      color:var(--danger);
    }
    .message.success{
      background:#ecfdf5;
      border-color:#bbf7d0;
      color:var(--success);
    }

    .footer{
      padding:16px 24px;
      border-top:1px solid var(--border);
      display:flex;
      justify-content:space-between;
      flex-wrap:wrap;
      gap:10px;
      background:#faf7f5;
    }

    .back-link{
      display:none;
      color:var(--maroon);
      font-weight:700;
      font-size:13px;
      text-decoration:none;
    }
    .back-link:hover{text-decoration:underline}

    .small{
      font-size:11px;
      color:var(--muted);
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="badge">Secure password reset</div>
      <div class="powered">Powered by<br><strong>Prince Alex Digital</strong></div>
    </div>

    <div class="card">
      <div class="accent">
        <span></span><span></span><span></span>
      </div>

      <div class="header">
        <h1>Reset your password</h1>
        <p id="instruction-text">Please enter your new password below.</p>
      </div>

      <div class="content">
        <form id="reset-form">
          <div>
            <label for="new-password">New password</label>
            <input type="password" id="new-password" placeholder="Enter new password" required>
          </div>

          <div>
            <label for="confirm-password">Confirm password</label>
            <input type="password" id="confirm-password" placeholder="Re-enter new password" required>
          </div>

          <div class="hint">Minimum 6 characters recommended.</div>

          <button type="submit" id="submit-btn">Reset Password</button>
        </form>

        <div id="message-area" class="message"></div>
      </div>

      <div class="footer">
        <div class="small">If you didn’t request this, you can safely close this page.</div>
        <a href="/index.html" class="back-link" id="back-link">Back to Home</a>
      </div>
    </div>
  </div>

  <!-- Firebase SDK (unchanged) -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
    import { getAuth, confirmPasswordReset, verifyPasswordResetCode } from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';

    const firebaseConfig = {
      apiKey: "AIzaSyDGErPBeQ1Fdx9EHPXOHepoEoOx7P2f57o",
      authDomain: "princealextravel.firebaseapp.com",
      projectId: "princealextravel",
      storageBucket: "princealextravel.firebasestorage.app",
      messagingSenderId: "947577729462",
      appId: "1:947577729462:web:dd4b4c7cb4a984c5e3d117"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const form = document.getElementById('reset-form');
    const newPasswordInput = document.getElementById('new-password');
    const confirmPasswordInput = document.getElementById('confirm-password');
    const messageArea = document.getElementById('message-area');
    const submitBtn = document.getElementById('submit-btn');
    const instructionText = document.getElementById('instruction-text');
    const backLink = document.getElementById('back-link');

    const actionCode = new URLSearchParams(window.location.search).get('oobCode');

    const showMessage = (type, text) => {
      messageArea.className = 'message show ' + type;
      messageArea.textContent = text;
    };

    const fail = (text) => {
      showMessage('error', text);
      form.style.display = 'none';
      backLink.style.display = 'inline-block';
    };

    if (actionCode) {
      verifyPasswordResetCode(auth, actionCode)
        .then(email => {
          instructionText.textContent = `Create a new password for ${email}.`;
        })
        .catch(() => fail('The password reset link is invalid or expired.'));
    } else {
      fail('No password reset code found. Please use the link from your email.');
    }

    form.addEventListener('submit', async e => {
      e.preventDefault();

      const newPass = newPasswordInput.value.trim();
      const confirmPass = confirmPasswordInput.value.trim();

      if (newPass.length < 6) {
        showMessage('error', 'Password must be at least 6 characters long.');
        return;
      }
      if (newPass !== confirmPass) {
        showMessage('error', 'Passwords do not match.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Resetting...';

      try {
        await confirmPasswordReset(auth, actionCode, newPass);
        showMessage('success', 'Password reset successful. You may now log in.');
        form.style.display = 'none';
        instructionText.style.display = 'none';
        backLink.style.display = 'inline-block';
      } catch (err) {
        showMessage('error', 'Error resetting password. Please request a new link.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
