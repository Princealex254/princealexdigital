<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Prince Alex AI Chat</title>

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root {
  --chat-primary: #1e3a8a;
  --chat-accent: #f59e0b;
  --chat-bg: #f8fafc;
  --chat-text: #1e293b;
  --chat-white: #ffffff;
  --chat-user-msg: #dcfce7;
  --chat-bot-msg: #f1f5f9;
  --glass-bg: rgba(255, 255, 255, 0.85);
}

* { box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

/* Floating Toggle Button */
#chat-btn {
  position: fixed;
  bottom: 25px;
  right: 25px;
  background: linear-gradient(135deg, #FFD700 0%, #D4AF37 100%);
  color: var(--chat-white);
  border: none;
  width: 60px;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.2);
  height: 60px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 24px;
  z-index: 1000;
  box-shadow: 0 4px 15px rgba(0,0,0,0.3);
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* End Session Action */
.end-session-trigger {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin: 10px 0 10px 40px;
  padding: 6px 12px;
  font-size: 0.75rem;
  color: #94a3b8;
  cursor: pointer;
  transition: color 0.2s;
}
.end-session-trigger:hover { color: #ef4444; }

#chat-btn:hover {
  transform: translateY(-4px);
}

.pulse {
  animation: pulse-animation 2s infinite;
}

@keyframes pulse-animation {
  0% { box-shadow: 0 0 0 0px rgba(212, 175, 55, 0.7); }
  70% { box-shadow: 0 0 0 10px rgba(37, 99, 235, 0); }
  100% { box-shadow: 0 0 0 0px rgba(212, 175, 55, 0); }
}

#chat-tooltip {
  position: fixed;
  bottom: 38px;
  right: 92px;
  background: var(--chat-white);
  color: var(--chat-text);
  padding: 6px 12px;
  border-radius: 12px 12px 0 12px;
  font-size: 11px;
  font-weight: 600;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  z-index: 999;
  white-space: nowrap;
  pointer-events: none;
  border: 1px solid #D4AF37;
  opacity: 1;
  transition: opacity 0.3s ease, transform 0.3s ease;
}

/* Chat Box */
#chat-box {
  position: fixed;
  bottom: 100px;
  right: 25px;
  width: 350px;
  height: 500px;
  max-height: calc(100dvh - 120px);
  background: var(--glass-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 16px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.15), 0 0 30px rgba(37, 99, 235, 0.15);
  display: flex; /* Always flex, visibility handled by opacity/pointer-events */
  flex-direction: column;
  overflow: hidden;
  z-index: 1000;
  /* animation: slideIn 0.3s ease-out, glow-pulse 4s infinite ease-in-out; */ /* slideIn replaced by CSS transition */
  animation: glow-pulse 4s infinite ease-in-out; /* Keep only the glow animation */
  border: 1px solid rgba(255, 255, 255, 0.3);

  /* Initial hidden state for smooth transition */
  opacity: 0;
  transform: translateY(20px) scale(0.95); /* Start slightly down and smaller */
  pointer-events: none; /* Prevents interaction when hidden */
  transform-origin: bottom right; /* Origin for scale and slide */
  transition: opacity 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), /* Spring-like ease-out */
              transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* Spring-like ease-out */
}

/* Class to make chat box visible and interactive */
#chat-box.chat-box-active {
  opacity: 1;
  transform: translateY(0) scale(1); /* End at original position and size */
  pointer-events: auto; /* Allow interaction when active */
}

/* AI Floating Particles Background */
#chat-particles-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  overflow: hidden; /* Keeps particles within the chatbox bounds */
  z-index: 0; /* Ensures it's behind other content */
  pointer-events: none; /* Prevents it from blocking clicks on chatbox content */
}

#chat-particles-container::before,
#chat-particles-container::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  filter: blur(40px); /* Soft blur effect */
  opacity: 0.3; /* Subtle presence */
  z-index: -1; /* Ensures they are behind the container's content */
}

/* Blob 1 - Blue */
#chat-particles-container::before {
  background: rgba(37, 99, 235, 0.7); /* Primary blue */
  width: 180px;
  height: 180px;
  top: 10%;
  left: 15%;
  animation: blob-move-1 15s infinite ease-in-out alternate;
}

/* Blob 2 - Purple */
#chat-particles-container::after {
  background: rgba(124, 58, 237, 0.7); /* A complementary purple */
  width: 220px;
  height: 220px;
  bottom: 15%;
  right: 10%;
  animation: blob-move-2 18s infinite ease-in-out alternate-reverse;
}

@keyframes blob-move-1 {
  0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
  25% { transform: translate(50px, -30px) scale(1.1); opacity: 0.4; }
  50% { transform: translate(100px, 50px) scale(0.9); opacity: 0.25; }
  75% { transform: translate(20px, 80px) scale(1.05); opacity: 0.35; }
  100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
}

@keyframes blob-move-2 {
  0% { transform: translate(0, 0) scale(1); opacity: 0.25; }
  30% { transform: translate(-70px, 40px) scale(1.15); opacity: 0.35; }
  60% { transform: translate(-20px, -60px) scale(0.95); opacity: 0.2; }
  100% { transform: translate(0, 0) scale(1); opacity: 0.25; }
}

/* Removed @keyframes slideIn as its functionality is now handled by CSS transitions */
@keyframes glow-pulse {
  0% { box-shadow: 0 10px 40px rgba(0,0,0,0.15), 0 0 20px rgba(37, 99, 235, 0.1); }
  50% { box-shadow: 0 10px 40px rgba(0,0,0,0.15), 0 0 45px rgba(37, 99, 235, 0.25); }
  100% { box-shadow: 0 10px 40px rgba(0,0,0,0.15), 0 0 20px rgba(37, 99, 235, 0.1); }
}

#chat-header {
  background: linear-gradient(135deg, var(--chat-primary) 0%, #2563eb 100%);
  color: var(--chat-white);
  padding: 15px 20px;
  font-weight: 700;
  display: flex;
  position: relative; /* Needed for z-index to work */
  z-index: 1; /* Ensures it's above the particles */
  justify-content: space-between;
  align-items: center;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.bot-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(255, 255, 255, 0.2);
  box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
  animation: avatar-glow 3s infinite ease-in-out;
}

@keyframes avatar-glow {
  0%, 100% { box-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }
  50% { box-shadow: 0 0 20px rgba(255, 255, 255, 0.6); }
}

.header-info h3 {
  margin: 0;
  font-size: 1.1rem;
  background: linear-gradient(to right, #ffffff, #93c5fd);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 800;
  letter-spacing: 0.5px;
}

.header-info small {
  font-size: 0.75rem;
  display: flex;
  align-items: center;
  gap: 5px;
  opacity: 0.9;
}

.status-dot {
  width: 8px;
  height: 8px;
  background: #22c55e;
  border-radius: 50%;
  animation: status-pulse 2s infinite;
}

@keyframes status-pulse {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.3); opacity: 0.7; }
  100% { transform: scale(1); opacity: 1; }
}

#chat-messages {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  font-size: 0.95rem;
  background: var(--chat-bg);
  position: relative; /* Needed for z-index to work */
  z-index: 1; /* Ensures it's above the particles */
  scroll-behavior: smooth;
  display: flex;
  flex-direction: column;
}

/* Message Wrappers & Grouping */
.msg-wrapper {
  display: flex;
  width: 100%;
  margin-bottom: 2px;
  position: relative;
  align-items: flex-end;
  transition: all 0.3s ease;
}

.msg-wrapper:not(.consecutive) {
  margin-top: 12px;
}

.bot-group { justify-content: flex-start; gap: 8px; }
.user-group { justify-content: flex-end; }

.msg-avatar-container {
  width: 32px;
  flex-shrink: 0;
  display: flex;
  align-items: flex-end;
}

.msg-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid rgba(0,0,0,0.05);
  animation: fadeUp 0.3s ease-out;
}

.msg {
  position: relative;
  margin-bottom: 0;
  padding: 10px 14px;
  border-radius: 18px;
  line-height: 1.4;
  max-width: 85%;
  word-wrap: break-word;
  animation: fadeUp 0.3s ease-out forwards;
  white-space: pre-wrap;
}

.user {
  background: var(--chat-primary);
  color: var(--chat-white);
  border-bottom-right-radius: 2px;
  box-shadow: 0 4px 15px rgba(30, 58, 138, 0.2);
}

.bot {
  background: var(--chat-white);
  color: var(--chat-text);
  border-bottom-left-radius: 2px;
  box-shadow: 0 4px 15px rgba(0,0,0,0.05);
}

/* Message Tails */
.msg::before {
  content: "";
  position: absolute;
  bottom: 0;
  width: 10px;
  height: 10px;
  z-index: -1;
}

.bot:not(.consecutive-msg)::before {
  left: -6px;
  background: var(--chat-white);
  clip-path: polygon(100% 0, 100% 100%, 0 100%);
}

.user:not(.consecutive-msg)::before {
  right: -6px;
  background: var(--chat-primary);
  clip-path: polygon(0 0, 0% 100%, 100% 100%);
}

/* Consecutive Overrides */
.consecutive-msg {
  border-radius: 18px !important;
}

.consecutive-msg::before {
  display: none !important;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg-time {
  display: block;
  font-size: 0.7rem;
  margin-top: 5px;
  opacity: 0.8;
}
.user .msg-time {
  text-align: right;
  color: rgba(255, 255, 255, 0.8);
}
.bot .msg-time {
  color: #94a3b8;
}

/* Chips */
.chips-container {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 10px 0 20px 40px;
  padding: 0 5px;
  animation: fadeUp 0.5s ease-out forwards;
}

.chip {
  background: var(--chat-white);
  border: 1px solid var(--chat-primary);
  color: var(--chat-primary);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}

.chip:hover {
  background: var(--chat-primary);
  color: white;
}

#input-area {
  display: flex;
  padding: 12px 15px;
  background: var(--chat-white);
  border-top: 1px solid #f1f5f9;
  position: relative; /* Needed for z-index to work */
  z-index: 1; /* Ensures it's above the particles */
  gap: 10px;
  align-items: center;
}

#input {
  flex: 1;
  padding: 12px 18px;
  border: 1px solid #f1f5f9;
  background: #f8fafc;
  border-radius: 24px;
  outline: none;
  font-size: 0.9rem;
  transition: border-color 0.2s;
}

#input:focus {
  border-color: var(--chat-primary);
}

.send-btn {
  background: var(--chat-primary);
  color: var(--chat-white);
  border: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}

.send-btn:hover { 
  background: #1e40af;
  box-shadow: 0 0 12px rgba(30, 58, 138, 0.3);
}

/* Typing Animation */
.typing-wrapper {
  display: flex;
  gap: 5px;
  padding: 10px 14px;
  background: rgba(255, 255, 255, 0.45);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: 18px 18px 18px 4px;
  position: relative;
  overflow: hidden;
  width: fit-content;
}

.typing-wrapper::before {
  content: "";
  position: absolute;
  top: 0;
  left: -150%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
  animation: ai-shimmer 2s infinite;
}

@keyframes ai-shimmer {
  0% { left: -150%; }
  100% { left: 150%; }
}

.typing-wrapper span {
  width: 6px;
  height: 6px;
  background: var(--chat-primary);
  border-radius: 50%;
  animation: typing-bounce 1.4s infinite ease-in-out;
  opacity: 0.6;
}

.typing-wrapper span:nth-child(1) { animation-delay: 0s; }
.typing-wrapper span:nth-child(2) { animation-delay: 0.2s; }
.typing-wrapper span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typing-bounce {
  0%, 80%, 100% { transform: translateY(0); }
  40% { transform: translateY(-5px); opacity: 1; }
}

.chat-footer {
  background: var(--chat-white);
  padding: 10px 8px;
  text-align: center;
  font-size: 0.65rem;
  color: #94a3b8;
  border-top: 1px solid transparent;
  border-image: linear-gradient(90deg, transparent, rgba(30, 58, 138, 0.15), transparent) 1;
  position: relative; /* Needed for z-index to work */
  z-index: 1; /* Ensures it's above the particles */
  letter-spacing: 0.5px;
}

/* Mobile Responsiveness */
@media (max-width: 480px) {
  #chat-box {
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100dvh; /* Prevents input from being hidden by keyboard */
    max-height: 100dvh;
    border-radius: 0;
    border: none;
  }
  #chat-header {
    padding: 10px 16px; /* Compact header */
  }
  #chat-messages {
    padding: 12px; /* Reduced padding */
    overscroll-behavior: contain;
  }
  #chat-btn {
    bottom: 15px;
    right: 15px;
  }
  #chat-tooltip { 
    bottom: 28px; 
    right: 80px;
    font-size: 10px;
  }
  .chat-footer {
    padding-bottom: calc(8px + env(safe-area-inset-bottom)); /* Safe Area Support */
    font-size: 0.6rem;
  }
}

/* Offline Status Banner */
#offline-status {
  background: #fee2e2;
  color: #b91c1c;
  padding: 8px;
  text-align: center;
  font-size: 0.75rem;
  font-weight: 600;
  display: none;
  border-bottom: 1px solid #fecaca;
  position: relative;
  z-index: 10;
}

.retry-btn {
  background: var(--chat-white);
  border: 1px solid #e2e8f0;
  color: var(--chat-primary);
  padding: 5px 12px;
  border-radius: 12px;
  font-size: 0.75rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 8px;
  transition: all 0.2s;
}
.retry-btn:hover {
  background: #f8fafc;
  border-color: var(--chat-primary);
}
</style>
</head>

<body>

<div id="chat-tooltip">Hi, I'm Alex, how can I assist you?</div>

<button id="chat-btn" class="pulse" onclick="toggleChat()">
    <i class="fa-solid fa-comments"></i>
</button>

<div id="chat-box">
  <div id="offline-status"><i class="fa-solid fa-wifi-slash"></i> No internet connection</div>
  <div id="chat-particles-container"></div>
  <div id="chat-header">
    <div class="header-left">
      <img src="mylogo.png" class="bot-avatar" alt="Logo">
      <div class="header-info">
        <h3>Prince Alex Digital Assistant</h3>
        <small><span class="status-dot"></span> Online • Replies instantly</small>
      </div>
    </div>
    <button onclick="toggleChat()" title="Minimize" style="background:none; border:none; color:white; cursor:pointer; font-size:1.1rem; opacity: 0.8; transition: opacity 0.2s;">
      <i class="fa-solid fa-chevron-down"></i>
    </button>
  </div>

  <div id="chat-messages"></div>

  <div id="input-area">
    <input id="input" placeholder="Type your message..." onkeypress="handleKeyPress(event)" />
    <button class="send-btn" onclick="sendMessage()">
        <i class="fa-solid fa-paper-plane"></i>
    </button>
  </div>
  
  <div class="chat-footer">
    Powered by Prince Alex Digital AI Suite
  </div>
</div>

<script>
const WEBHOOK_URL = "https://eocm4wbwiq06jds.m.pipedream.net";
let lastUserMessage = "";
let pendingRetry = false;

const botSound = new Audio("https://cdn.pixabay.com/audio/2022/03/15/audio_502755913e.mp3");
const WELCOME_MESSAGES = [
  "Hello 👋 Welcome to Prince Alex Digital.\n\nWe help businesses grow through websites, automation, branding and digital solutions.\n\nHow can we help you today?"
];
let welcomeSent = false;
let isTyping = false;

function getSessionId() {
  let id = localStorage.getItem("sessionId");

  if (!id) {
    id = "user_" + Math.random().toString(36).substring(2, 10);
    localStorage.setItem("sessionId", id);
  }

  return id;
}

function loadChatHistory() {
  const history = JSON.parse(localStorage.getItem("chatHistory") || "[]");
  if (history.length > 0) {
    welcomeSent = true;
    history.forEach(m => addMessage(m.text, m.type, false, false, m.time));
  }
}

window.addEventListener('online', () => {
  document.getElementById("offline-status").style.display = "none";
  if (pendingRetry && lastUserMessage) {
    pendingRetry = false;
    retryLastMessage();
  }
});

window.addEventListener('offline', () => {
  document.getElementById("offline-status").style.display = "block";
});

function toggleChat() {
  const box = document.getElementById("chat-box");
  const btn = document.getElementById("chat-btn");
  const tooltip = document.getElementById("chat-tooltip");
  
  if (box.classList.contains('chat-box-active')) {
    box.classList.remove('chat-box-active');
    if (tooltip) tooltip.style.opacity = "1";
  } else {
    box.classList.add('chat-box-active');
    btn.classList.remove("pulse");
    if (tooltip) tooltip.style.opacity = "0";
    if (!welcomeSent) {
      showWelcome();
      welcomeSent = true;
    }
  }
}

function resetChat() {
  localStorage.removeItem("chatHistory");
  localStorage.removeItem("sessionId");
  document.getElementById("chat-messages").innerHTML = "";
  welcomeSent = false;
  toggleChat();
}

async function showWelcome() {
  isTyping = true;
  for (const text of WELCOME_MESSAGES) {
    const typingIndicator = addMessage("...", "bot");
    // Simulate a natural pause for reading and typing
    await new Promise(resolve => setTimeout(resolve, 1000));
    typingIndicator.remove();
    await addMessage(text, "bot", true);
  }
  isTyping = false;
  addChips(["Website", "POS", "Branding", "CV Revamp"]);
}

function addEndSessionButton() {
  const container = document.createElement("div");
  container.className = "end-session-trigger";
  container.id = "end-session-btn";
  container.innerHTML = `<i class="fa-solid fa-power-off"></i> End Session`;
  container.onclick = resetChat;
  document.getElementById("chat-messages").appendChild(container);
  const msgBox = document.getElementById("chat-messages");
  msgBox.scrollTop = msgBox.scrollHeight;
}

function addChips(options) {
  const container = document.createElement("div");
  container.className = "chips-container";
  options.forEach(opt => {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.innerText = opt;
    chip.onclick = () => sendMessage(opt);
    container.appendChild(chip);
  });
  document.getElementById("chat-messages").appendChild(container);
  const msgBox = document.getElementById("chat-messages");
  msgBox.scrollTop = msgBox.scrollHeight;
}

function addMessage(text, type, animate = false, save = true, time = null) {
  const msgBox = document.getElementById("chat-messages");
  
  // Grouping logic: check if the last message-wrapper is the same type
  const wrappers = msgBox.querySelectorAll('.msg-wrapper');
  const lastWrapper = wrappers.length > 0 ? wrappers[wrappers.length - 1] : null;
  const isConsecutive = lastWrapper && lastWrapper.classList.contains(type + '-group');

  const wrapper = document.createElement("div");
  wrapper.className = `msg-wrapper ${type}-group ${isConsecutive ? 'consecutive' : ''}`;
  
  if (type === "bot") {
    const avatarContainer = document.createElement("div");
    avatarContainer.className = "msg-avatar-container";
    if (!isConsecutive) {
      const img = document.createElement("img");
      img.src = "mylogo.png";
      img.className = "msg-avatar";
      avatarContainer.appendChild(img);
    }
    wrapper.appendChild(avatarContainer);
  }

  const div = document.createElement("div");
  div.className = "msg " + type + (isConsecutive ? " consecutive-msg" : "");
  
  if (text === "...") {
    div.innerHTML = '<div class="typing-wrapper"><span></span><span></span><span></span></div>';
    div.id = "typing-indicator";
    div.style.background = "transparent";
    div.style.boxShadow = "none";
    div.style.padding = "0";
  } else {
    const timeStr = time || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    if (save && text) {
      const history = JSON.parse(localStorage.getItem("chatHistory") || "[]");
      history.push({ text, type, time: timeStr });
      localStorage.setItem("chatHistory", JSON.stringify(history));
    }

    const textContainer = document.createElement("span");
    div.appendChild(textContainer);

    const timeSpan = document.createElement("span");
    timeSpan.className = "msg-time";
    timeSpan.innerText = timeStr;
    div.appendChild(timeSpan);

    if (!animate || type !== "bot") {
      textContainer.textContent = text;
    }

    if (type === "bot") {
      if (save) {
        botSound.play().catch(() => {}); // Catch prevents errors if user hasn't interacted yet
        const box = document.getElementById("chat-box");
        if (!box.classList.contains('chat-box-active')) {
          document.getElementById("chat-btn").classList.add("pulse");
        }
      }
    }
  }
  
  wrapper.appendChild(div);
  msgBox.appendChild(wrapper);
  
  // Delay ensures scroll happens after DOM layout reflow
  setTimeout(() => {
    msgBox.scrollTop = msgBox.scrollHeight;
  }, 50);
  
  if (animate && type === "bot" && text !== "...") {
    let i = 0;
    const speed = 10; // Adjusted for a smooth "streaming" feel
    const textContainer = div.querySelector('span:not(.msg-time)');
    return new Promise(resolve => {
      function typeWriter() {
        if (i < text.length) {
          textContainer.textContent += text.charAt(i);
          i++;
          msgBox.scrollTop = msgBox.scrollHeight;
          setTimeout(typeWriter, speed);
        } else {
          resolve(wrapper);
        }
      }
      typeWriter();
    });
  }

  return wrapper;
}

function addErrorMessage(text) {
  const wrapper = addMessage("", "bot", false, false);
  const msgDiv = wrapper.querySelector(".msg.bot");
  msgDiv.innerHTML = `
    <div style="display: flex; flex-direction: column; align-items: flex-start;">
      <span><i class="fa-solid fa-circle-exclamation" style="color: #ef4444; margin-right: 5px;"></i>${text}</span>
      <button class="retry-btn" onclick="retryLastMessage()">
        <i class="fa-solid fa-rotate-right"></i> Retry Now
      </button>
    </div>
  `;
}

function retryLastMessage() {
  if (lastUserMessage) {
    // Clean up previous retry UI if it exists
    const wrappers = document.querySelectorAll('.msg-wrapper');
    const last = wrappers[wrappers.length - 1];
    if (last && last.querySelector('.retry-btn')) {
      last.remove();
    }
    sendMessage(lastUserMessage);
  }
}

function handleKeyPress(e) {
  if (e.key === 'Enter') sendMessage();
}

async function sendMessage(overrideMsg = null) {
  const input = document.getElementById("input");
  const message = overrideMsg || input.value.trim();
  
  if (!message || isTyping) return;

  lastUserMessage = message;
  pendingRetry = false;

  // Remove chips if they exist when a message is sent
  const existingChips = document.querySelector('.chips-container');
  if (existingChips) existingChips.remove();

  if (!navigator.onLine) {
    addErrorMessage("It looks like you're offline. I'll try again when you're back.");
    pendingRetry = true;
    if (!overrideMsg) input.value = "";
    return;
  }

  addMessage(message, "user");
  if (!overrideMsg) input.value = "";

  // Remove previous end session button if it exists
  const oldEnd = document.getElementById("end-session-btn");
  if (oldEnd) oldEnd.remove();

  isTyping = true;
  const typingIndicator = addMessage("...", "bot");

  try {
    const res = await fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        sessionId: getSessionId(),
        message: message
      })
    });

    typingIndicator.remove();

    const rawText = await res.text();

    let data;

    try {
      data = JSON.parse(rawText);
    } catch (e) {
      addMessage("Apologies for the brief hitch! 🛠️ My connection caught a slight delay just now. Could you try sending that last message one more time?", "bot");
      isTyping = false;
      return;
    }

    // Robust extraction covering various Activepieces response formats
    const personality = [
      "Let me check that for you...",
      "Working on it...",
      "Analyzing your request..."
    ];
    let reply = personality[Math.floor(Math.random() * personality.length)];

    if (typeof data === 'string') {
      reply = data;
    } else if (data.output) {
      reply = data.output;
    } else if (data.reply) {
      if (Array.isArray(data.reply)) {
        // Checks for 'content', 'Content', or direct string
        const firstReply = data.reply[0];
        reply = firstReply?.content || firstReply?.Content || (typeof firstReply === 'string' ? firstReply : JSON.stringify(firstReply));
      } else {
        reply = data.reply;
      }
    } else if (data.choices?.[0]?.message?.content) {
      reply = data.choices[0].message.content;
    } else if (typeof data === 'object' && data !== null) {
      // Fallback to grab the first string property if the structure changes
      const stringKeys = Object.keys(data).filter(k => typeof data[k] === 'string');
      if (stringKeys.length > 0) reply = data[stringKeys[0]];
    }

    await addMessage(reply, "bot", true);
    addEndSessionButton();

  } catch (err) {
    console.error("Chatbox Fetch Error:", err);
    if (typingIndicator) typingIndicator.remove();
    addErrorMessage("Sorry, I'm having trouble connecting. Check your internet.");
    pendingRetry = true;
  }
  isTyping = false;
}

loadChatHistory();
</script>
