<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Prince Alex AI Chat</title>

<!-- Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
:root {
  --chat-primary: #123b78;
  --chat-primary-deep: #0b2854;
  --chat-accent: #c99b3b;
  --chat-gold-soft: #f7e7b4;
  --chat-bg: #f4f7fb;
  --chat-text: #192b42;
  --chat-white: #ffffff;
  --chat-surface: #ffffff;
  --chat-border: #dfe7f0;
  --chat-input-bg: #f7f9fc;
  --chat-user-msg: #123b78;
  --chat-bot-msg: #ffffff;
  --glass-bg: rgba(255, 255, 255, 0.96);
}

/* Dark theme — only surfaces/text swap; --chat-white stays pure white
   since it's used for text/icons sitting on colored (not surface)
   backgrounds like the header and primary buttons, which don't change. */
:root[data-theme="dark"] {
  --chat-bg: #101d31;
  --chat-text: #e2e8f0;
  --chat-surface: #172940;
  --chat-border: #30445d;
  --chat-input-bg: #101d31;
  --glass-bg: rgba(23, 41, 64, 0.98);
}

* { box-sizing: border-box; font-family: 'Trebuchet MS', 'Segoe UI', sans-serif; }

/* Floating Toggle Button */
#chat-btn {
  position: fixed;
  bottom: 25px;
  right: 25px;
  background: linear-gradient(135deg, #e6c46c 0%, #b98222 100%);
  color: var(--chat-white);
  border: none;
  width: 60px;
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255,255,255,0.2);
  height: 60px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 24px;
  z-index: 1000;
  box-shadow: 0 8px 24px rgba(11, 40, 84, 0.25);
  transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  display: flex;
  align-items: center;
  justify-content: center;
}

/* End Session Action */
.end-session-trigger {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin: 10px 0 10px 40px;
  padding: 6px 12px;
  font-size: 0.75rem;
  color: #94a3b8;
  cursor: pointer;
  transition: color 0.2s;
}
.end-session-trigger:hover { color: #ef4444; }

#chat-btn:hover {
  transform: translateY(-4px);
}

.pulse {
  animation: pulse-animation 3s infinite;
}

@keyframes pulse-animation {
  0% { box-shadow: 0 8px 24px rgba(11, 40, 84, 0.25); }
  70% { box-shadow: 0 8px 24px rgba(11, 40, 84, 0.25), 0 0 0 7px rgba(201, 155, 59, 0.12); }
  100% { box-shadow: 0 8px 24px rgba(11, 40, 84, 0.25); }
}

#chat-tooltip {
  position: fixed;
  bottom: 38px;
  right: 92px;
  background: var(--chat-surface);
  color: var(--chat-text);
  font-size: 11px;
  font-weight: 600;
  box-shadow: 0 4px 15px rgba(0,0,0,0.1);
  z-index: 999;
  white-space: nowrap;
  pointer-events: none;
  border: 1px solid var(--chat-accent);
  opacity: 1;
  transition: opacity 0.3s ease, transform 0.3s ease;
}

/* Chat Box */
#chat-box {
  position: fixed;
  bottom: 100px;
  right: 25px;
  width: min(560px, calc(100vw - 50px));
  height: min(720px, calc(100dvh - 120px));
  max-height: calc(100dvh - 120px);
  background: var(--glass-bg);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: 16px;
  box-shadow: 0 16px 45px rgba(11, 40, 84, 0.2);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  z-index: 1000;
  animation: none;
  border: 1px solid rgba(255, 255, 255, 0.3);
  opacity: 0;
  transform: translateY(20px) scale(0.95);
  pointer-events: none;
  transform-origin: bottom right;
  transition: opacity 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
              transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

#chat-box.chat-box-active {
  opacity: 1;
  transform: translateY(0) scale(1);
  pointer-events: auto;
}

/* AI Floating Particles Background */
#chat-particles-container {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  z-index: 0;
  pointer-events: none;
}

#chat-particles-container::before,
#chat-particles-container::after {
  content: '';
  position: absolute;
  border-radius: 50%;
  filter: blur(55px);
  opacity: 0.12;
  z-index: -1;
}

#chat-particles-container::before {
  background: rgba(30, 91, 166, 0.55);
  width: 180px;
  height: 180px;
  top: 10%;
  left: 15%;
  animation: blob-move-1 24s infinite ease-in-out alternate;
}

#chat-particles-container::after {
  background: rgba(201, 155, 59, 0.5);
  width: 220px;
  height: 220px;
  bottom: 15%;
  right: 10%;
  animation: blob-move-2 28s infinite ease-in-out alternate-reverse;
}

@keyframes blob-move-1 {
  0% { transform: translate(0, 0) scale(1); opacity: 0.3; }
  25% { transform: translate(50px, -30px) scale(1.1); opacity: 0.4; }
  50% { transform: translate(100px, 50px) scale(0.9); opacity: 0.25; }
  75% { transform: translate(20px, 80px) scale(1.05); opacity: 0.35; }
  100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
}

@keyframes blob-move-2 {
  0% { transform: translate(0, 0) scale(1); opacity: 0.25; }
  30% { transform: translate(-70px, 40px) scale(1.15); opacity: 0.35; }
  60% { transform: translate(-20px, -60px) scale(0.95); opacity: 0.2; }
  100% { transform: translate(0, 0) scale(1); opacity: 0.25; }
}

@keyframes glow-pulse {
  0% { box-shadow: 0 10px 40px rgba(0,0,0,0.15), 0 0 20px rgba(37, 99, 235, 0.1); }
  50% { box-shadow: 0 10px 40px rgba(0,0,0,0.15), 0 0 45px rgba(37, 99, 235, 0.25); }
  100% { box-shadow: 0 10px 40px rgba(0,0,0,0.15), 0 0 20px rgba(37, 99, 235, 0.1); }
}

#chat-header {
  background: linear-gradient(135deg, var(--chat-primary-deep) 0%, var(--chat-primary) 72%, #1d5ca3 100%);
  color: var(--chat-white);
  padding: 16px 20px;
  border-bottom: 2px solid var(--chat-accent);
  font-weight: 700;
  display: flex;
  position: relative;
  z-index: 1;
  justify-content: space-between;
  align-items: center;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.bot-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid rgba(255, 255, 255, 0.2);
  box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
  animation: none;
  border-color: rgba(247, 231, 180, 0.7);
}

@keyframes avatar-glow {
  0%, 100% { box-shadow: 0 0 10px rgba(255, 255, 255, 0.3); }
  50% { box-shadow: 0 0 20px rgba(255, 255, 255, 0.6); }
}

.header-info h3 {
  margin: 0;
  font-size: 1.1rem;
  background: linear-gradient(to right, #ffffff, var(--chat-gold-soft));
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 800;
  letter-spacing: 0.5px;
}

.header-info small {
  font-size: 0.75rem;
  display: flex;
  align-items: center;
  gap: 5px;
  opacity: 0.9;
}

.status-dot {
  width: 8px;
  height: 8px;
  background: #22c55e;
  border-radius: 50%;
  animation: status-pulse 2s infinite;
}

@keyframes status-pulse {
  0% { transform: scale(1); opacity: 1; }
  50% { transform: scale(1.3); opacity: 0.7; }
  100% { transform: scale(1); opacity: 1; }
}

#chat-messages {
  flex: 1;
  padding: 22px 20px;
  overflow-y: auto;
  font-size: 0.95rem;
  background: var(--chat-bg);
  position: relative;
  z-index: 1;
  scroll-behavior: smooth;
  display: flex;
  flex-direction: column;
}

/* Message Wrappers & Grouping */
.msg-wrapper {
  display: flex;
  width: 100%;
  margin-bottom: 2px;
  position: relative;
  align-items: flex-end;
  transition: all 0.3s ease;
}

.msg-wrapper:not(.consecutive) {
  margin-top: 16px;
}

.bot-group { justify-content: flex-start; gap: 8px; }
.user-group { justify-content: flex-end; }

.msg-avatar-container {
  width: 32px;
  flex-shrink: 0;
  display: flex;
  align-items: flex-end;
}

.msg-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  object-fit: cover;
  border: 1px solid rgba(0,0,0,0.05);
  animation: fadeUp 0.3s ease-out;
}

.msg {
  position: relative;
  margin-bottom: 0;
  padding: 11px 15px;
  border-radius: 18px;
  line-height: 1.4;
  max-width: 85%;
  word-wrap: break-word;
  animation: fadeUp 0.3s ease-out forwards;
  white-space: pre-wrap;
}

.user {
  background: linear-gradient(135deg, var(--chat-primary), #1c5a9b);
  color: var(--chat-white);
  border-bottom-right-radius: 2px;
  box-shadow: 0 5px 14px rgba(18, 59, 120, 0.18);
}

.bot {
  background: var(--chat-surface);
  color: var(--chat-text);
  border-bottom-left-radius: 2px;
  border: 1px solid var(--chat-border);
  box-shadow: 0 4px 12px rgba(11, 40, 84, 0.06);
}

.msg::before {
  content: "";
  position: absolute;
  bottom: 0;
  width: 10px;
  height: 10px;
  z-index: -1;
}

.bot:not(.consecutive-msg)::before {
  left: -6px;
  background: var(--chat-surface);
  clip-path: polygon(100% 0, 100% 100%, 0 100%);
}

.user:not(.consecutive-msg)::before {
  right: -6px;
  background: var(--chat-primary);
  clip-path: polygon(0 0, 0% 100%, 100% 100%);
}

.consecutive-msg {
  border-radius: 18px !important;
}

.consecutive-msg::before {
  display: none !important;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.msg-time {
  display: block;
  font-size: 0.7rem;
  margin-top: 5px;
  opacity: 0.8;
}
.user .msg-time {
  text-align: right;
  color: rgba(255, 255, 255, 0.8);
}
.bot .msg-time {
  color: #94a3b8;
}

/* Chips */
.chips-container {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 10px 0 20px 40px;
  padding: 0 5px;
  animation: fadeUp 0.5s ease-out forwards;
}

.chip {
  background: var(--chat-surface);
  border: 1px solid var(--chat-primary);
  color: var(--chat-primary);
  padding: 6px 14px;
  border-radius: 20px;
  font-size: 0.8rem;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
}

.chip:hover {
  background: var(--chat-primary);
  color: white;
}

#input-area {
  display: flex;
  padding: 14px 16px;
  background: var(--chat-surface);
  border-top: 1px solid var(--chat-border);
  position: relative;
  z-index: 1;
  gap: 10px;
  align-items: center;
}

#input {
  flex: 1;
  padding: 12px 18px;
  border: 1px solid #d5e0eb;
  background: var(--chat-input-bg);
  color: var(--chat-text);
  border-radius: 24px;
  outline: none;
  font-size: 0.9rem;
  transition: border-color 0.2s;
}

#input:focus {
  border-color: var(--chat-primary);
}

.error-state {
  border: 1px solid #fecaca;
  background: #fff7f7;
  color: #991b1b;
  border-radius: 12px;
  padding: 10px 12px;
}

.send-btn {
  background: var(--chat-accent);
  color: var(--chat-white);
  border: none;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.2s;
}

.send-btn:hover { 
  background: #b98222;
  box-shadow: 0 0 12px rgba(201, 155, 59, 0.3);
}

.stop-btn {
  display: none;
  flex-shrink: 0;
  width: 40px;
  height: 40px;
  border: 1px solid #e7b0b0;
  border-radius: 50%;
  background: #fff5f5;
  color: #c53030;
  cursor: pointer;
  align-items: center;
  justify-content: center;
}
.stop-btn.visible { display: flex; }
.stop-btn:hover { background: #fee2e2; }
#send-btn:disabled { opacity: 0.45; cursor: wait; }

button:focus-visible,
input:focus-visible {
  outline: 3px solid rgba(201, 155, 59, 0.55);
  outline-offset: 2px;
}

/* Typing Animation */
.typing-wrapper {
  display: flex;
  gap: 5px;
  padding: 10px 14px;
  background: var(--chat-surface);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.4);
  border-radius: 18px 18px 18px 4px;
  position: relative;
  overflow: hidden;
  width: fit-content;
}

.typing-label {
  margin-right: 4px;
  color: #648096;
  font-size: 0.78rem;
}

.message-actions {
  display: flex;
  gap: 4px;
  margin-top: 8px;
  opacity: 0;
  transition: opacity 0.2s ease;
}
.msg:hover .message-actions,
.msg:focus-within .message-actions { opacity: 1; }
.message-action {
  width: 28px;
  height: 28px;
  padding: 0;
  border: 1px solid var(--chat-border);
  border-radius: 8px;
  background: transparent;
  color: #7890a0;
  cursor: pointer;
  font-size: 0.75rem;
}
.message-action:hover,
.message-action.selected {
  color: var(--chat-primary);
  border-color: var(--chat-accent);
  background: rgba(201, 155, 59, 0.1);
}
.user .message-actions { display: none; }

.typing-wrapper::before {
  content: "";
  position: absolute;
  top: 0;
  left: -150%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
  animation: none;
}

@keyframes ai-shimmer {
  0% { left: -150%; }
  100% { left: 150%; }
}

.typing-wrapper span {
  width: 6px;
  height: 6px;
  background: var(--chat-primary);
  border-radius: 50%;
  animation: typing-bounce 1.4s infinite ease-in-out;
  opacity: 0.6;
}

.typing-wrapper span:nth-child(1) { animation-delay: 0s; }
.typing-wrapper span:nth-child(2) { animation-delay: 0.2s; }
.typing-wrapper span:nth-child(3) { animation-delay: 0.4s; }

@keyframes typing-bounce {
  0%, 80%, 100% { transform: translateY(0); }
  40% { transform: translateY(-5px); opacity: 1; }
}

.chat-footer {
  background: var(--chat-surface);
  padding: 11px 8px;
  text-align: center;
  font-size: 0.65rem;
  color: #94a3b8;
  border-top: 1px solid transparent;
  border-image: linear-gradient(90deg, transparent, rgba(201, 155, 59, 0.35), transparent) 1;
  position: relative;
  z-index: 1;
  letter-spacing: 0.5px;
}

@media (min-width: 1200px) {
  #chat-box {
    width: min(620px, calc(100vw - 50px));
    height: min(760px, calc(100dvh - 120px));
  }

  #chat-messages {
    padding: 24px;
    font-size: 1rem;
  }

  .msg {
    max-width: 78%;
    padding: 12px 16px;
  }
}

@media (min-width: 1600px) {
  #chat-box {
    width: min(680px, calc(100vw - 50px));
    height: min(800px, calc(100dvh - 120px));
  }
}

@media (max-width: 480px) {
  #chat-box {
    right: 0;
    bottom: 0;
    width: 100%;
    height: 100dvh;
    max-height: 100dvh;
    border-radius: 0;
    border: none;
  }
  #chat-header { padding: 12px 16px; }
  #chat-messages { padding: 16px 12px; overscroll-behavior: contain; }
  .msg { max-width: 88%; padding: 10px 13px; }
  .msg-wrapper:not(.consecutive) { margin-top: 12px; }
  #input-area { padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); }
  #input { min-width: 0; padding: 11px 15px; }
  #chat-btn { bottom: 15px; right: 15px; }
  #chat-tooltip { bottom: 28px; right: 80px; font-size: 10px; }
  .chat-footer { padding-bottom: calc(8px + env(safe-area-inset-bottom)); font-size: 0.6rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    scroll-behavior: auto !important;
    transition-duration: 0.01ms !important;
  }
}

/* Offline Status Banner */
#offline-status {
  background: #fee2e2;
  color: #b91c1c;
  padding: 8px;
  text-align: center;
  font-size: 0.75rem;
  font-weight: 600;
  display: none;
  border-bottom: 1px solid #fecaca;
  position: relative;
  z-index: 10;
}

.retry-btn {
  background: var(--chat-surface);
  border: 1px solid var(--chat-border);
  color: var(--chat-primary);
  padding: 5px 12px;
  border-radius: 12px;
  font-size: 0.75rem;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  margin-top: 8px;
  transition: all 0.2s;
}
.retry-btn:hover {
  background: var(--chat-input-bg);
  border-color: var(--chat-primary);
}

/* Unread message badge on the launcher button */
.unread-badge {
  position: absolute;
  top: -4px;
  right: -4px;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  background: var(--chat-accent);
  color: var(--chat-white);
  border: 2px solid var(--chat-white);
  border-radius: 999px;
  font-size: 11px;
  font-weight: 700;
  display: none;
  align-items: center;
  justify-content: center;
  line-height: 1;
}
.unread-badge.visible { display: flex; }

/* Fallback avatar shown if mylogo.png fails to load */
.avatar-fallback, .msg-avatar-fallback {
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--chat-primary);
  color: var(--chat-white);
  border-radius: 50%;
}
.avatar-fallback { width: 40px; height: 40px; font-size: 1rem; }
.msg-avatar-fallback { width: 32px; height: 32px; font-size: 0.85rem; }

/* Visually-hidden but screen-reader-accessible content */
.sr-only {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

/* "New message" pill — appears when the user has scrolled up and a new
   message arrives, so it isn't missed off-screen */
#scroll-to-bottom {
  position: absolute;
  bottom: 78px;
  left: 50%;
  transform: translateX(-50%) translateY(10px);
  background: var(--chat-primary);
  color: var(--chat-white);
  border: none;
  border-radius: 20px;
  padding: 7px 16px;
  font-size: 0.78rem;
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s ease, transform 0.25s ease;
  z-index: 2;
}
#scroll-to-bottom.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
  pointer-events: auto;
}

/* Character counter, only shown near the input's max length */
.char-counter {
  font-size: 0.7rem;
  color: #ef4444;
  white-space: nowrap;
  display: none;
}
.char-counter.visible { display: inline; }

#mute-btn:hover { opacity: 1 !important; }
#theme-btn:hover { opacity: 1 !important; }

#mic-btn {
  background: var(--chat-surface);
  border: 1px solid var(--chat-border);
  color: var(--chat-primary);
  width: 40px;
  height: 40px;
  border-radius: 50%;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
#mic-btn:hover { background: var(--chat-input-bg); }
#mic-btn.recording {
  background: #ef4444;
  border-color: #ef4444;
  color: var(--chat-white);
  animation: mic-pulse 1.2s infinite;
}
@keyframes mic-pulse {
  0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.5); }
  70% { box-shadow: 0 0 0 10px rgba(239,68,68,0); }
  100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); }
}
</style>
</head>

<body>

<div id="chat-tooltip">Hi, I'm Alex, how can I assist you?</div>

<button id="chat-btn" class="pulse" onclick="toggleChat()" aria-label="Open chat with Alex" aria-expanded="false">
    <i class="fa-solid fa-comments"></i>
    <span id="unread-badge" class="unread-badge" aria-hidden="true">0</span>
</button>

<div id="chat-box" role="dialog" aria-modal="false" aria-label="Chat with Alex, Prince Alex Digital">
  <div id="offline-status"><i class="fa-solid fa-wifi-slash"></i> No internet connection</div>
  <div id="chat-particles-container"></div>
  <div id="chat-header">
    <div class="header-left">
      <img src="mylogo.png" class="bot-avatar" alt="Alex's avatar" onerror="this.onerror=null; this.style.display='none'; this.nextElementSibling.style.display='flex';">
      <div class="avatar-fallback" style="display:none;"><i class="fa-solid fa-user"></i></div>
      <div class="header-info">
        <h3>Prince Alex Digital Assistant</h3>
        <small><span class="status-dot"></span> Online • Replies instantly</small>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <button id="theme-btn" onclick="toggleTheme()" title="Toggle dark mode" aria-label="Toggle dark mode" aria-pressed="false" style="background:none; border:none; color:white; cursor:pointer; font-size:1rem; opacity: 0.8; transition: opacity 0.2s;">
        <i class="fa-solid fa-moon"></i>
      </button>
      <button id="mute-btn" onclick="toggleMute()" title="Mute notification sound" aria-label="Mute notification sound" aria-pressed="false" style="background:none; border:none; color:white; cursor:pointer; font-size:1rem; opacity: 0.8; transition: opacity 0.2s;">
        <i class="fa-solid fa-volume-high"></i>
      </button>
      <button onclick="toggleChat()" title="Minimize" aria-label="Minimize chat" style="background:none; border:none; color:white; cursor:pointer; font-size:1.1rem; opacity: 0.8; transition: opacity 0.2s;">
        <i class="fa-solid fa-chevron-down"></i>
      </button>
    </div>
  </div>

  <div id="chat-messages" aria-live="off"></div>
  <div id="sr-announcer" class="sr-only" aria-live="polite" aria-atomic="true"></div>
  <button id="scroll-to-bottom" onclick="scrollToBottomNow()" aria-label="Scroll to latest message">
    <i class="fa-solid fa-arrow-down"></i> New message
  </button>

  <div id="input-area">
    <label for="input" class="sr-only">Type your message</label>
    <input id="input" placeholder="Type your message..." onkeypress="handleKeyPress(event)" oninput="updateCharCounter()" maxlength="2000" aria-label="Type your message" />
    <span id="char-counter" class="char-counter" aria-hidden="true"></span>
    <button id="mic-btn" onclick="toggleVoiceInput()" aria-label="Speak your message" style="display:none;">
        <i class="fa-solid fa-microphone"></i>
    </button>
    <button id="stop-btn" class="stop-btn" onclick="stopGeneration()" aria-label="Stop generating response" title="Stop generating response" aria-hidden="true" tabindex="-1">
      <i class="fa-solid fa-stop"></i>
    </button>
    <button id="send-btn" class="send-btn" onclick="sendMessage()" aria-label="Send message" title="Send message">
        <i class="fa-solid fa-paper-plane"></i>
    </button>
  </div>
  <div id="voice-status" class="sr-only" aria-live="polite"></div>

  
  <div class="chat-footer">
    Powered by Prince Alex Digital AI Suite
  </div>
</div>

<script>
// Pointing securely to your live Cloudflare Worker proxy
const WEBHOOK_URL = "https://princealex-chat-ai.princealexdigital.workers.dev";
let lastUserMessage = "";
let pendingRetry = false;

const botSound = new Audio("https://cdn.pixabay.com/audio/2022/03/15/audio_502755913e.mp3");
const WELCOME_MESSAGES = [
  "Hey! I'm Alex over at Prince Alex Digital.\n\nWe do websites, automation, branding — pretty much anything to help your business grow online.\n\nWhat can I help you with today?"
];
let welcomeSent = false;
let isTyping = false;
let activeController = null;
let unreadCount = 0;
let soundMuted = localStorage.getItem("soundMuted") === "true";
updateMuteIcon();

let darkMode = localStorage.getItem("darkMode") === "true";
applyTheme();

function toggleTheme() {
  darkMode = !darkMode;
  localStorage.setItem("darkMode", darkMode);
  applyTheme();
}

function applyTheme() {
  document.documentElement.setAttribute("data-theme", darkMode ? "dark" : "light");
  const btn = document.getElementById("theme-btn");
  if (!btn) return;
  btn.setAttribute("aria-pressed", String(darkMode));
  btn.innerHTML = `<i class="fa-solid ${darkMode ? "fa-sun" : "fa-moon"}"></i>`;
}

// Voice input via the Web Speech API. Feature-detected — the mic button
// stays hidden entirely on browsers that don't support it (notably
// Firefox and most non-Chromium browsers), rather than showing a control
// that would just fail silently.
const SpeechRecognitionAPI = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let isRecording = false;

if (SpeechRecognitionAPI) {
  document.getElementById("mic-btn").style.display = "inline-flex";
  recognition = new SpeechRecognitionAPI();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.lang = "en-US";

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    const input = document.getElementById("input");
    input.value = (input.value ? input.value + " " : "") + transcript;
    updateCharCounter();
  };
  recognition.onerror = () => { stopRecording(); };
  recognition.onend = () => { stopRecording(); };
}

function toggleVoiceInput() {
  if (!recognition) return;
  if (isRecording) {
    recognition.stop();
  } else {
    isRecording = true;
    document.getElementById("mic-btn").classList.add("recording");
    document.getElementById("voice-status").textContent = "Listening...";
    try { recognition.start(); } catch (e) { stopRecording(); }
  }
}

function stopRecording() {
  isRecording = false;
  document.getElementById("mic-btn").classList.remove("recording");
  document.getElementById("voice-status").textContent = "";
}

function toggleMute() {
  soundMuted = !soundMuted;
  localStorage.setItem("soundMuted", soundMuted);
  updateMuteIcon();
}

function updateMuteIcon() {
  const btn = document.getElementById("mute-btn");
  if (!btn) return;
  btn.setAttribute("aria-pressed", String(soundMuted));
  btn.title = soundMuted ? "Unmute notification sound" : "Mute notification sound";
  btn.innerHTML = `<i class="fa-solid ${soundMuted ? "fa-volume-xmark" : "fa-volume-high"}"></i>`;
}

function updateUnreadBadge() {
  const badge = document.getElementById("unread-badge");
  if (!badge) return;
  if (unreadCount > 0) {
    badge.textContent = unreadCount > 9 ? "9+" : String(unreadCount);
    badge.classList.add("visible");
  } else {
    badge.classList.remove("visible");
  }
}

function updateCharCounter() {
  const input = document.getElementById("input");
  const counter = document.getElementById("char-counter");
  const remaining = 2000 - input.value.length;
  if (remaining <= 200) {
    counter.textContent = remaining;
    counter.classList.add("visible");
  } else {
    counter.classList.remove("visible");
  }
}

function scrollToBottomNow() {
  const msgBox = document.getElementById("chat-messages");
  msgBox.scrollTop = msgBox.scrollHeight;
  document.getElementById("scroll-to-bottom").classList.remove("visible");
}

function setGenerationState(active) {
  isTyping = active;
  const stopButton = document.getElementById("stop-btn");
  const sendButton = document.getElementById("send-btn");
  if (stopButton) {
    stopButton.classList.toggle("visible", active);
    stopButton.setAttribute("aria-hidden", String(!active));
    stopButton.tabIndex = active ? 0 : -1;
  }
  if (sendButton) sendButton.disabled = active;
}

function stopGeneration() {
  if (!isTyping) return;
  if (activeController) activeController.abort();
  activeController = null;
  const indicator = document.getElementById("typing-indicator");
  if (indicator) indicator.closest(".msg-wrapper")?.remove();
  setGenerationState(false);
  addMessage("No problem — I stopped that reply. Send another message whenever you're ready.", "bot", true);
}

function getSessionId() {
  let id = localStorage.getItem("sessionId");
  if (!id) {
    id = "user_" + Math.random().toString(36).substring(2, 10);
    localStorage.setItem("sessionId", id);
  }
  return id;
}

function loadChatHistory() {
  const history = JSON.parse(localStorage.getItem("chatHistory") || "[]");
  if (history.length > 0) {
    welcomeSent = true;
    history.forEach(m => addMessage(m.text, m.type, false, false, m.time));
  }
}

window.addEventListener('online', () => {
  document.getElementById("offline-status").style.display = "none";
  if (pendingRetry && lastUserMessage) {
    pendingRetry = false;
    retryLastMessage();
  }
});

window.addEventListener('offline', () => {
  document.getElementById("offline-status").style.display = "block";
});

// Show the "new message" pill only when the user has scrolled away from
// the bottom — no point showing it if they're already looking at the end.
document.getElementById("chat-messages").addEventListener('scroll', () => {
  const msgBox = document.getElementById("chat-messages");
  const distanceFromBottom = msgBox.scrollHeight - msgBox.scrollTop - msgBox.clientHeight;
  if (distanceFromBottom < 60) {
    document.getElementById("scroll-to-bottom").classList.remove("visible");
  }
});

function toggleChat() {
  const box = document.getElementById("chat-box");
  const tooltip = document.getElementById("chat-tooltip");
  const btn = document.getElementById("chat-btn");
  
  if (box.classList.contains('chat-box-active')) {
    box.classList.remove('chat-box-active');
    btn.setAttribute("aria-expanded", "false");
    if (tooltip) tooltip.style.opacity = "1";
  } else {
    box.classList.add('chat-box-active');
    btn.classList.remove("pulse");
    btn.setAttribute("aria-expanded", "true");
    unreadCount = 0;
    updateUnreadBadge();
    if (tooltip) tooltip.style.opacity = "0";
    if (!welcomeSent) {
      showWelcome();
      welcomeSent = true;
    }
  }
}

function resetChat() {
  localStorage.removeItem("chatHistory");
  // Note: sessionId is intentionally NOT cleared here. It's the key the
  // backend uses to recall this client (name, past conversations, etc.)
  // across sessions — wiping it every time someone ends a chat would
  // defeat the point of having long-term memory at all.
  document.getElementById("chat-messages").innerHTML = "";
  welcomeSent = false;
  toggleChat();
}

async function showWelcome() {
  isTyping = true;
  for (const text of WELCOME_MESSAGES) {
    const typingIndicator = addMessage("...", "bot");
    await new Promise(resolve => setTimeout(resolve, 1000));
    typingIndicator.remove();
    await addMessage(text, "bot", true);
  }
  isTyping = false;
  addChips(["Website", "POS", "Branding", "CV Revamp"]);
}

function addEndSessionButton() {
  const container = document.createElement("div");
  container.className = "end-session-trigger";
  container.id = "end-session-btn";
  container.innerHTML = `<i class="fa-solid fa-power-off"></i> End Session`;
  container.onclick = resetChat;
  document.getElementById("chat-messages").appendChild(container);
  const msgBox = document.getElementById("chat-messages");
  msgBox.scrollTop = msgBox.scrollHeight;
}

function addChips(options) {
  const container = document.createElement("div");
  container.className = "chips-container";
  options.forEach(opt => {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.innerText = opt;
    chip.onclick = () => sendMessage(opt);
    container.appendChild(chip);
  });
  document.getElementById("chat-messages").appendChild(container);
  const msgBox = document.getElementById("chat-messages");
  msgBox.scrollTop = msgBox.scrollHeight;
}

function addMessage(text, type, animate = false, save = true, time = null) {
  const msgBox = document.getElementById("chat-messages");
  const wrappers = msgBox.querySelectorAll('.msg-wrapper');
  const lastWrapper = wrappers.length > 0 ? wrappers[wrappers.length - 1] : null;
  const isConsecutive = lastWrapper && lastWrapper.classList.contains(type + '-group');

  const wrapper = document.createElement("div");
  wrapper.className = `msg-wrapper ${type}-group ${isConsecutive ? 'consecutive' : ''}`;
  
  if (type === "bot") {
    const avatarContainer = document.createElement("div");
    avatarContainer.className = "msg-avatar-container";
    if (!isConsecutive) {
      const img = document.createElement("img");
      img.src = "mylogo.png";
      img.className = "msg-avatar";
      img.alt = "Alex";
      img.onerror = function () {
        this.onerror = null;
        this.replaceWith(Object.assign(document.createElement("div"), {
          className: "msg-avatar msg-avatar-fallback",
          innerHTML: '<i class="fa-solid fa-user"></i>'
        }));
      };
      avatarContainer.appendChild(img);
    }
    wrapper.appendChild(avatarContainer);
  }

  const div = document.createElement("div");
  div.className = "msg " + type + (isConsecutive ? " consecutive-msg" : "");
  
  if (text === "...") {
    div.innerHTML = '<div class="typing-wrapper" role="status" aria-label="Alex is typing"><span class="typing-label">Alex is typing</span><span></span><span></span><span></span></div>';
    div.id = "typing-indicator";
    div.style.background = "transparent";
    div.style.boxShadow = "none";
    div.style.padding = "0";
  } else {
    const timeStr = time || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    if (save && text) {
      const history = JSON.parse(localStorage.getItem("chatHistory") || "[]");
      history.push({ text, type, time: timeStr });
      const trimmed = history.length > MAX_STORED_MESSAGES ? history.slice(-MAX_STORED_MESSAGES) : history;
      localStorage.setItem("chatHistory", JSON.stringify(trimmed));
    }

    const textContainer = document.createElement("span");
    div.appendChild(textContainer);

    const timeSpan = document.createElement("span");
    timeSpan.className = "msg-time";
    timeSpan.innerText = timeStr;
    div.appendChild(timeSpan);

    if (!animate || type !== "bot") {
      textContainer.textContent = text;
    }

    if (type === "bot" && animate) {
      if (!soundMuted) botSound.play().catch(() => {});
      const box = document.getElementById("chat-box");
      if (!box.classList.contains('chat-box-active')) {
        document.getElementById("chat-btn").classList.add("pulse");
        unreadCount++;
        updateUnreadBadge();
      } else {
        // Chat is open — if the user has scrolled up away from the
        // latest message, surface a pill instead of forcing a jump.
        const distanceFromBottom = msgBox.scrollHeight - msgBox.scrollTop - msgBox.clientHeight;
        if (distanceFromBottom > 80) {
          document.getElementById("scroll-to-bottom").classList.add("visible");
        }
      }
    }
  }
  
  wrapper.appendChild(div);
  msgBox.appendChild(wrapper);
  
  setTimeout(() => {
    msgBox.scrollTop = msgBox.scrollHeight;
  }, 50);
  
  if (animate && type === "bot" && text !== "...") {
    let i = 0;
    const speed = 10;
    const textContainer = div.querySelector('span:not(.msg-time)');
    return new Promise(resolve => {
      function typeWriter() {
        if (i < text.length) {
          textContainer.textContent += text.charAt(i);
          i++;
          msgBox.scrollTop = msgBox.scrollHeight;
          setTimeout(typeWriter, speed);
        } else {
          addMessageActions(div, text);
          const announcer = document.getElementById("sr-announcer");
          if (announcer) announcer.textContent = text;
          resolve(wrapper);
        }
      }
      typeWriter();
    });
  }

  if (!animate && type === "bot" && text !== "...") {
    addMessageActions(div, text);
  }

  return wrapper;
}

function addMessageActions(messageElement, text) {
  const actions = document.createElement("div");
  actions.className = "message-actions";
  actions.innerHTML = `
    <button class="message-action" type="button" title="Copy response" aria-label="Copy response"><i class="fa-regular fa-copy"></i></button>
    <button class="message-action" type="button" title="Helpful" aria-label="Mark response helpful"><i class="fa-regular fa-thumbs-up"></i></button>
    <button class="message-action" type="button" title="Not helpful" aria-label="Mark response not helpful"><i class="fa-regular fa-thumbs-down"></i></button>
    <button class="message-action" type="button" title="Regenerate response" aria-label="Regenerate response"><i class="fa-solid fa-rotate"></i></button>`;
  const buttons = actions.querySelectorAll("button");
  buttons[0].onclick = () => copyResponse(text, buttons[0]);
  buttons[1].onclick = () => rateResponse(buttons[1], buttons[2]);
  buttons[2].onclick = () => rateResponse(buttons[2], buttons[1]);
  buttons[3].onclick = () => regenerateResponse(text);
  messageElement.appendChild(actions);
}

async function copyResponse(text, button) {
  try {
    await navigator.clipboard.writeText(text);
    button.innerHTML = '<i class="fa-solid fa-check"></i>';
    button.title = "Copied";
    setTimeout(() => {
      button.innerHTML = '<i class="fa-regular fa-copy"></i>';
      button.title = "Copy response";
    }, 1500);
  } catch (error) {
    button.title = "Copy failed";
  }
}

function rateResponse(button, otherButton) {
  button.classList.add("selected");
  otherButton.classList.remove("selected");
  button.setAttribute("aria-pressed", "true");
}

function regenerateResponse(responseText) {
  const history = JSON.parse(localStorage.getItem("chatHistory") || "[]");
  const lastUser = [...history].reverse().find(entry => entry.type === "user");
  if (lastUser) sendMessage(lastUser.text, { regenerate: true });
}

function addErrorMessage(text) {
  const wrapper = addMessage("", "bot", false, false);
  const msgDiv = wrapper.querySelector(".msg.bot");
  msgDiv.classList.add("error-state");
  msgDiv.innerHTML = `
    <div style="display: flex; flex-direction: column; align-items: flex-start;">
      <span><i class="fa-solid fa-circle-exclamation" style="color: #ef4444; margin-right: 5px;"></i>${text}</span>
      <button class="retry-btn" onclick="retryLastMessage()">
        <i class="fa-solid fa-rotate-right"></i> Retry Now
      </button>
    </div>
  `;
}

function retryLastMessage() {
  if (lastUserMessage) {
    const wrappers = document.querySelectorAll('.msg-wrapper');
    const last = wrappers[wrappers.length - 1];
    if (last && last.querySelector('.retry-btn')) {
      last.remove();
    }
    sendMessage(lastUserMessage, { regenerate: true });
  }
}

// Helper to save messages to local storage context
const MAX_STORED_MESSAGES = 100; // keep localStorage (and the payload we send) bounded

function saveToHistory(text, type) {
  const history = JSON.parse(localStorage.getItem("chatHistory") || "[]");
  // NOTE: key is "time", not "timestamp" — must match what addMessage()'s
  // own inline save uses and what loadChatHistory() reads back, or
  // reloaded messages silently lose their real send time.
  history.push({ text: text, type: type, time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) });
  const trimmed = history.length > MAX_STORED_MESSAGES ? history.slice(-MAX_STORED_MESSAGES) : history;
  localStorage.setItem("chatHistory", JSON.stringify(trimmed));
}

function handleKeyPress(e) {
  if (e.key === 'Enter') sendMessage();
}

async function sendMessage(overrideMsg = null, options = {}) {
  const input = document.getElementById("input");
  const message = overrideMsg || input.value.trim();
  
  if (!message || isTyping) return;

  lastUserMessage = message;
  pendingRetry = false;

  const existingChips = document.querySelector('.chips-container');
  if (existingChips) existingChips.remove();

  if (!navigator.onLine) {
    addErrorMessage("It looks like you're offline. I'll try again when you're back.");
    pendingRetry = true;
    if (!overrideMsg) input.value = "";
    return;
  }

  // Regeneration reuses the existing user message and must not duplicate it.
  if (!options.regenerate) {
    saveToHistory(message, "user");
    addMessage(message, "user", false, false);
  }
  if (!overrideMsg) { input.value = ""; updateCharCounter(); }

  const oldEnd = document.getElementById("end-session-btn");
  if (oldEnd) oldEnd.remove();

  setGenerationState(true);
  const typingIndicator = addMessage("...", "bot");
  activeController = new AbortController();

  // Pull down the fresh history array to send to the Cloudflare Worker.
  // Capped to the last 40 — the backend only ever looks at the last 30
  // for detection and the last 12 for the AI itself, so sending more is
  // just wasted bandwidth/latency on every single request.
  const localHistory = JSON.parse(localStorage.getItem("chatHistory") || "[]").slice(-40);
  
  try {
    const fetchPromise = fetch(WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      signal: activeController.signal,
      body: JSON.stringify({
        message: message,
        history: localHistory, // Passes everything including the prompt history
        clientKey: getSessionId() // Lets the backend recall this client across visits
      })
    });
    // Timeout via Promise.race rather than AbortController/signal — some
    // hosting/preview environments proxy fetch through postMessage across
    // an iframe boundary, and AbortSignal can't be structured-cloned
    // there, which throws a DataCloneError. This approach never touches
    // fetch's options object, so it can't hit that issue.
    const timeoutPromise = new Promise((_, reject) => {
      setTimeout(() => reject(new Error("TimeoutError")), 30000);
    });
    const res = await Promise.race([fetchPromise, timeoutPromise]);

    if (typingIndicator) typingIndicator.closest(".msg-wrapper")?.remove();
    const data = await res.json();
    let reply = data.reply || "I didn't catch that. Could you try again?";

    // Safety net: the backend should already send a clean reply with any
    // ###EMAIL_START###/###COMPLAINT_START### block stripped out, but if
    // that ever fails, showing the raw tags verbatim in chat would be a
    // glaring, robotic-looking break — so we strip both here too.
    let cleanReply = reply;
    if (cleanReply.includes("###EMAIL_START###")) {
      cleanReply = cleanReply.split("###EMAIL_START###")[0].trim();
      console.log("Automated proposal JSON captured successfully from edge worker.");
    }
    if (cleanReply.includes("###COMPLAINT_START###")) {
      cleanReply = cleanReply.split("###COMPLAINT_START###")[0].trim();
      console.log("Automated complaint JSON captured successfully from edge worker.");
    }
    if (!cleanReply) cleanReply = "Got it — one moment while I sort that out for you.";

    // Render bot response to user interface (save=false since we save explicitly below)
    await addMessage(cleanReply, "bot", true, false);
    
    // CRITICAL FIX: Save the bot's clean response into history so it's remembered next turn!
    saveToHistory(cleanReply, "bot");
    
    addEndSessionButton();

  } catch (err) {
    console.error("Connection Error:", err);
    if (typingIndicator) typingIndicator.closest(".msg-wrapper")?.remove();
    if (err.name !== "AbortError") {
      const timedOut = err.message === "TimeoutError";
      addErrorMessage(timedOut
        ? "That is taking longer than expected. You can retry now or send your message again."
        : "I couldn't reach the chat service. Check your connection, then try again.");
      pendingRetry = true;
    }
  }
  activeController = null;
  setGenerationState(false);
}

loadChatHistory();
</script>

</body>
</html>
